aid: sava
name: SAVA
description: >-
  SAVA (sava.health) is a health-monitoring company developing a minimally
  invasive, continuous multi-molecule biosensor worn just beneath the skin. The
  platform is designed to capture real-time molecular data - glucose, lactate,
  ketones, sodium, histamine, urea, alcohol, and cortisol - and surface it
  through a connected mobile app, aiming to shift healthcare toward preventative
  monitoring and personal wellness. The company is early stage and pre-launch,
  operating a waiting-list model for early access to its device rather than a
  public product. It publishes no first-party developer API or health-data API;
  its marketing site is built on Wix and exposes the Wix Site MCP endpoint and a
  published llms.txt for agentic access to public site content only. Backed by
  Balderton Capital.
